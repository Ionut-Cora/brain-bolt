<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>BrainBolt</title>
    <meta name="description" content="BrainBolt Quiz Game - provide users with an engaging, interesting and funny experience." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- favicons generated by favicon.io -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/images/favicon-16x16.png"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <div class="logo-div">
        <a href="./index.html">
          <svg width="10%" height="10%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="#e79638" d="M184 120C184 89.1 209.1 64 240 64L264 64C281.7 64 296 78.3 296 96L296 544C296 561.7 281.7 576 264 576L232 576C202.2 576 177.1 555.6 170 528C169.3 528 168.7 528 168 528C123.8 528 88 492.2 88 448C88 430 94 413.4 104 400C84.6 385.4 72 362.2 72 336C72 305.1 89.6 278.2 115.2 264.9C108.1 252.9 104 238.9 104 224C104 179.8 139.8 144 184 144L184 120zM456 120L456 144C500.2 144 536 179.8 536 224C536 239 531.9 253 524.8 264.9C550.5 278.2 568 305 568 336C568 362.2 555.4 385.4 536 400C546 413.4 552 430 552 448C552 492.2 516.2 528 472 528C471.3 528 470.7 528 470 528C462.9 555.6 437.8 576 408 576L376 576C358.3 576 344 561.7 344 544L344 96C344 78.3 358.3 64 376 64L400 64C430.9 64 456 89.1 456 120z"/></svg>
          <span>BrainBolt</span>
        </a>
      </div>
    </header>

    <main>
      <div class="container">
        <!-- Start Section -->
        <section class="card" id="start-section">
          <h1>Start BrainBolt Quiz</h1>

          <form id="start-form">
            <label for="player-name">Your name</label>
            <input type="text" id="player-name" maxlength="50" required />

            <label for="question-count">Number of questions</label>
            <select id="question-count">
              <option value="3">3 questions</option>
              <option value="6">6 questions</option>
              <option value="9">9 questions</option>
            </select>

            <label for="difficulty-level">Difficulty</label>
            <select id="difficulty-level">
              <option value="easy">Beginner</option>
              <option value="medium">Intermediate</option>
              <option value="hard">Hard</option>
            </select>
            <div class="btn-div">
              <button class="text-uppercase" type="submit">Start</button>
            </div>
          </form>

          <!-- Error or loading messages -->
          <p id="message-text"></p>
        </section>

        <!-- Quiz Section -->
        <section class="card hidden" id="quiz-section">
          <div class="quiz-info">
            <p>
              Question: <span id="question-number">0</span>/<span
                id="total-questions"
                >0</span
              >
            </p>
            <p>Score: <span id="score">0</span></p>
            <p id="time-paragraph">Time: <span id="time">20</span>s</p>
          </div>

          <img id="question-image" src="" alt="Question image" />

          <h2 id="question"></h2>

          <div id="answers-content"></div>

          <!-- Feedback after the answer -->
          <div id="feedback-section" class="hidden">
            <h3 id="feedback-title"></h3>
            <p id="feedback-text"></p>
            <div class="btn-div">
              <button class="text-uppercase" id="next-btn" type="button">Next</button>
            </div>
          </div>
        </section>

        <!-- Result Section -->
        <section class="card hidden" id="result-section">
          <h2>Quiz Complete</h2>
          <p id="result-text"></p>
          <div class="btn-div">
            <button class="text-uppercase" id="restart-btn" type="button">Play Again</button>
          </div>
        </section>

        <!-- Leaderboard Section (Local Storage scores) -->
        <section class="card">
          <h2>Leaderboard</h2>
          <ol id="leaderboard"></ol>
          <div class="btn-div">
            <button class="text-uppercase" id="clear-btn" type="button">Clear Scores</button>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>copyright &copy; BrainBolt 2026</p>
    </footer>

    <!-- Custom JavaScript -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
